<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#12151e"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="120" y1="0" x2="120" y2="750"/>
    <line x1="1080" y1="0" x2="1080" y2="750"/>
  </g>

  <!-- Navbar Mockup -->
  <g transform="translate(120, 30)">
    <circle cx="20" cy="20" r="16" fill="#fb7185" fill-opacity="0.2" stroke="#fb7185" stroke-width="1.5"/>
    <path d="M14 20 L26 20 M20 14 L20 26" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="2">ATELIER CAPILAR</text>
    
    <text x="480" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Servicios</text>
    <text x="560" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Colorimetría</text>
    <text x="660" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Tratamientos</text>
    <text x="770" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ubicación</text>

    <!-- WhatsApp CTA -->
    <rect x="850" y="4" width="130" height="34" rx="10" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
    <text x="915" y="26" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">RESERVAR CITA</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(120, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="28" rx="8" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#fb7185"/>
    <text x="26" y="18" fill="#fb7185" font-family="monospace" font-weight="600" font-size="10" letter-spacing="1">ESTILISMO &amp; TRATAMIENTOS</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">El arte del corte,</text>
    <text x="0" y="140" fill="url(#roseAccent)" font-family="system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">color y cuidado personal.</text>
    
    <!-- Subtitle -->
    <text x="0" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Especialistas en balayage, keratina y tratamientos reconstructivos.</text>
    <text x="0" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="15">Cita previa en 1 toque directo por WhatsApp sin esperas.</text>

    <!-- CTA Buttons -->
    <rect x="0" y="260" width="220" height="52" rx="16" fill="url(#roseAccent)"/>
    <text x="110" y="293" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Pedir Cita Online →</text>

    <rect x="235" y="260" width="180" height="52" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="325" y="293" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Ver Catálogo</text>
  </g>

  <!-- Right Visual / Gallery Cards -->
  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="400" height="320" rx="24" fill="#131722" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Mock Service Cards -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="352" height="74" rx="14" fill="#1a1f2e" stroke="#28334a" stroke-width="1"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#fb7185" fill-opacity="0.15"/>
      <text x="37" y="42" fill="#fb7185" font-family="system-ui" font-size="18" text-anchor="middle">✂</text>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Corte &amp; Estilo de Autor</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Asesoría visagista personalizada</text>
      <text x="330" y="44" fill="#fb7185" font-family="monospace" font-weight="700" font-size="13" text-anchor="end">Desde 28€</text>
    </g>

    <g transform="translate(24, 112)">
      <rect x="0" y="0" width="352" height="74" rx="14" fill="#1a1f2e" stroke="#28334a" stroke-width="1"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#a855f7" fill-opacity="0.15"/>
      <text x="37" y="42" fill="#a855f7" font-family="system-ui" font-size="18" text-anchor="middle">✦</text>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Balayage &amp; Colorimetría 3D</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Degradados naturales sin daño térmico</text>
      <text x="330" y="44" fill="#a855f7" font-family="monospace" font-weight="700" font-size="13" text-anchor="end">Desde 65€</text>
    </g>

    <g transform="translate(24, 200)">
      <rect x="0" y="0" width="352" height="74" rx="14" fill="#1a1f2e" stroke="#28334a" stroke-width="1"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="37" y="42" fill="#38bdf8" font-family="system-ui" font-size="18" text-anchor="middle">💧</text>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Hidratación Ácido Hialurónico</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sellado de cutícula y brillo espejo</text>
      <text x="330" y="44" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="13" text-anchor="end">Desde 45€</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(120, 560)">
    <rect x="0" y="0" width="960" height="110" rx="20" fill="#0f131c" stroke="#1e2535" stroke-width="1"/>
    
    <g transform="translate(60, 35)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28">100%</text>
      <text x="0" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Optimizado para móvil</text>
    </g>

    <line x1="280" y1="25" x2="280" y2="85" stroke="#1e2535" stroke-width="1"/>

    <g transform="translate(340, 35)">
      <text x="0" y="24" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="800" font-size="28">&lt; 0.4s</text>
      <text x="0" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Carga instantánea 4G</text>
    </g>

    <line x1="560" y1="25" x2="560" y2="85" stroke="#1e2535" stroke-width="1"/>

    <g transform="translate(620, 35)">
      <text x="0" y="24" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="800" font-size="28">+45%</text>
      <text x="0" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Aumento de citas online</text>
    </g>
  </g>
</svg>
